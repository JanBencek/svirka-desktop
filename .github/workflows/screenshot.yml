name: Windows screenshot

# Manual check of the window on real Windows, in the Windows 10 look (SVIRKA_ROUND=1: the runner's Windows rounds
# corners itself): start the app, screenshot the desktop, keep the PNGs as the run's artifact.
on: workflow_dispatch

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js  # the binary isn't always fetched by npm ci
      - name: Start Svirka and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(208, 48, 48))
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png")
          }
          [System.Environment]::OSVersion.Version
          $env:SVIRKA_ROUND = "1"
          Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 25
          Shot "window"
          # drag the bottom-right corner up-left, then click maximise (positions: the 944x660 window at 40,30)
          Add-Type -Namespace W -Name U -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, System.IntPtr e);
          "@
          [W.U]::SetCursorPos(981, 687); Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
          foreach ($i in 1..10) { [W.U]::SetCursorPos(981 - 15 * $i, 687 - 10 * $i); Start-Sleep -Milliseconds 60 }
          Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
          Shot "resized"
          [W.U]::SetCursorPos(764, 46); Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 2
          Shot "maximized"
          Get-Content out.txt -Tail 20
          Get-Content err.txt -Tail 10
      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: "*.png"
