name: Windows screenshot

# Manual check of the window on real Windows (title bar overlay, drag strip, snapping): start the app, screenshot the
# desktop, keep the PNGs as the run's artifact.
on: workflow_dispatch

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js  # the binary isn't always fetched by npm ci
      - name: Start Svirka and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(208, 48, 48))
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name.png")
          }
          [System.Environment]::OSVersion.Version
          Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 25
          Shot "window"
          # the 944x660 page sits at 40,30: resize from its bottom-right corner, double-click the strip to maximise
          # and back, then snap with Win+Left
          Add-Type -Namespace W -Name U -MemberDefinition @"
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, System.IntPtr e);
          [DllImport("user32.dll")] public static extern void keybd_event(byte k, byte s, uint f, System.IntPtr e);
          "@
          function Click { [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero) }
          # drag the window by the strip: 200 px right, 120 down
          [W.U]::SetCursorPos(300, 46); Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
          foreach ($i in 1..10) { [W.U]::SetCursorPos(300 + 20 * $i, 46 + 12 * $i); Start-Sleep -Milliseconds 60 }
          [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
          Shot "dragged"
          # and back
          [W.U]::SetCursorPos(500, 166); [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
          foreach ($i in 1..10) { [W.U]::SetCursorPos(500 - 20 * $i, 166 - 12 * $i); Start-Sleep -Milliseconds 60 }
          [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
          [W.U]::SetCursorPos(982, 688); Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
          foreach ($i in 1..10) { [W.U]::SetCursorPos(982 - 15 * $i, 688 - 10 * $i); Start-Sleep -Milliseconds 60 }
          [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
          Shot "resized"
          [W.U]::SetCursorPos(300, 46); Start-Sleep -Milliseconds 300
          Click; Start-Sleep -Milliseconds 80; Click; Start-Sleep -Seconds 2
          Shot "maximized"
          [W.U]::SetCursorPos(300, 16); Start-Sleep -Milliseconds 300
          Click; Start-Sleep -Milliseconds 80; Click; Start-Sleep -Seconds 2
          Shot "restored"
          [W.U]::keybd_event(0x5B, 0, 0, [IntPtr]::Zero); [W.U]::keybd_event(0x25, 0, 0, [IntPtr]::Zero)
          [W.U]::keybd_event(0x25, 0, 2, [IntPtr]::Zero); [W.U]::keybd_event(0x5B, 0, 2, [IntPtr]::Zero)
          Start-Sleep -Seconds 2
          [W.U]::keybd_event(0x1B, 0, 0, [IntPtr]::Zero); [W.U]::keybd_event(0x1B, 0, 2, [IntPtr]::Zero)  # close snap assist
          Start-Sleep -Seconds 1
          Shot "snapped"
          # Svirka's dark layout (a copy of its colours, no login needed): the window's edge against the page
          Stop-Process -Name electron -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2
          Set-Content dark.html '<html class="dark" style="background:#0a0a0a;color:#fafafa;font:14px Segoe UI"><body style="margin:0;background:#0a0a0a"><div class="h-dvh" style="display:flex;flex-direction:column;gap:8px;padding:8px;box-sizing:border-box;height:100vh"><div style="flex:1;display:flex;gap:8px"><div style="width:240px;background:#171717;border-radius:8px"></div><div style="flex:1;background:#171717;border-radius:8px"></div></div><div style="height:88px;background:#171717;border-radius:8px"></div></div></body></html>'
          $env:SVIRKA_URL = "file:///$($PWD -replace '\\','/')/dark.html"
          Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -RedirectStandardOutput out2.txt -RedirectStandardError err2.txt
          Start-Sleep -Seconds 15
          Shot "dark"
          # after navigating to another site (as logging in does: auth.bencit.com -> music.bencit.com), drag again
          Stop-Process -Name electron -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2
          Set-Content hop.html '<body style="background:#171717"><script>setTimeout(() => location.href = "https://auth.bencit.com/", 2000)</script></body>'
          $env:SVIRKA_URL = "file:///$($PWD -replace '\\','/')/hop.html"
          Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList "." -RedirectStandardOutput out3.txt -RedirectStandardError err3.txt
          Start-Sleep -Seconds 15
          Shot "navigated"
          [W.U]::SetCursorPos(300, 46); Start-Sleep -Milliseconds 300
          [W.U]::mouse_event(2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
          foreach ($i in 1..10) { [W.U]::SetCursorPos(300 + 20 * $i, 46 + 12 * $i); Start-Sleep -Milliseconds 60 }
          [W.U]::mouse_event(4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
          Shot "navigated-dragged"
          Get-Content out.txt -Tail 20
          Get-Content err.txt -Tail 10
      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: "*.png"
